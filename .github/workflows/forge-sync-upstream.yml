name: Forge Upstream Sync

# Why: upstream (stablyai/orca) ships daily and FORGE-90 fixes the sync cadence
# that FORGE-76 left manual. The job replays the forge-sync skill mechanically:
# merge upstream/main into a sync branch cut from forge, run the fast gates, and
# open a review PR — never pushing a merge to forge itself, so a broken sync is
# a closed PR, not a broken default branch.
#
# Deliberate limits:
#   - Conflicts are never auto-resolved. Legitimate conflicts only exist in the
#     FORGE-OVERRIDES.md / FORGE.md Mutation Whitelist files, and resolving them
#     needs user-approved decisions — the job stops, annotates the conflicted
#     files, and updates the recurring failure issue instead.
#   - The PR is created with the default GITHUB_TOKEN, so it does NOT trigger
#     the upstream pull_request workflows (GitHub blocks recursive runs from the
#     job token). The gates below are the pre-PR verification; details in
#     docs/forge/daily-upstream-sync.md.
#   - 08:33 UTC = 05:33 BRT (UTC-3, no DST): after the US workday's pushes,
#     before the Brazilian workday starts. Minute 33 stays clear of the other
#     scheduled workflows firing at :00/:15/:17/:23/:30.

on:
  schedule:
    - cron: '33 8 * * *'
  workflow_dispatch:

concurrency:
  group: forge-sync-upstream
  # A half-finished merge must never be cancelled midway; queue instead.
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      outcome: ${{ steps.verdict.outputs.outcome }}
      failed_gate: ${{ steps.failed-gate.outputs.gate }}
      conflict_files: ${{ steps.conflict-report.outputs.conflict_files }}
      pr_url: ${{ steps.pr.outputs.url }}
    steps:
      - name: Checkout forge
        uses: actions/checkout@v6
        with:
          ref: forge
          # Full graph: the merge needs both sides' history and the PR body
          # reports the forge..upstream/main commit range.
          fetch-depth: 0

      - name: Identify as forge-sync bot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Fetch upstream main
        run: |
          git remote add upstream https://github.com/stablyai/orca.git
          git fetch upstream main --no-tags

      - name: Count pending upstream commits
        id: sync-check
        run: |
          count="$(git rev-list --count forge..upstream/main)"
          echo "count=$count" >> "$GITHUB_OUTPUT"
          echo "### Forge upstream sync" >> "$GITHUB_STEP_SUMMARY"
          if [ "$count" -eq 0 ]; then
            echo "outcome=up-to-date" >> "$GITHUB_OUTPUT"
            echo "\`forge\` is already up to date with \`upstream/main\` — nothing to do." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Pending upstream commits: **$count**" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Cut sync branch from forge
        if: steps.sync-check.outputs.count != '0'
        run: git checkout -B forge-sync/upstream

      - name: Merge upstream/main
        id: merge
        if: steps.sync-check.outputs.count != '0'
        run: git merge upstream/main --no-edit

      - name: Report merge conflicts and stop
        id: conflict-report
        # No auto-resolution: whitelisted-file conflicts need user-approved
        # decisions (forge-sync skill). Abort the merge so nothing is pushed.
        if: failure() && steps.merge.outcome == 'failure'
        run: |
          {
            echo "conflict_files<<FILES"
            git diff --name-only --diff-filter=U || true
            echo "FILES"
          } >> "$GITHUB_OUTPUT"
          files="$(git diff --name-only --diff-filter=U | tr '\n' ' ')"
          echo "::error title=Upstream sync conflict::Conflicted files (must be in FORGE-OVERRIDES.md to be legitimate): $files"
          {
            echo "## Merge conflicts"
            echo ""
            echo "Auto-resolution refused. Conflicted files:"
            echo ""
            echo '```'
            git diff --name-only --diff-filter=U || true
            echo '```'
            echo ""
            echo "Legitimate conflicts are only in files listed in FORGE-OVERRIDES.md."
            echo "Resolve manually with the forge-sync skill, then re-run this workflow."
          } >> "$GITHUB_STEP_SUMMARY"
          git merge --abort || true
          exit 1

      - name: Install dependencies
        if: steps.sync-check.outputs.count != '0'
        uses: ./.github/actions/install-node-dependencies
        with:
          # Tests build node-pty; typecheck alone would not need a runtime.
          native-runtime: node

      - name: Gate - typecheck
        id: tc
        if: steps.sync-check.outputs.count != '0'
        run: pnpm tc

      # The identity/forge scoped set from the forge-sync skill: the tests
      # pinned to our rebrand (most likely to break on an upstream merge) plus
      # our own namespaces. Full shards run on the PR's CI when the user asks.
      - name: Gate - scoped tests
        id: scoped-tests
        if: steps.sync-check.outputs.count != '0'
        env:
          ORCA_BACKGROUND_LAUNCH: '1'
        run: >-
          pnpm exec vitest run --config config/vitest.config.ts
          src/main/startup/dev-instance-identity.test.ts
          src/main/daemon/daemon-host-relocation.test.ts
          src/main/local-builds/
          src/shared/local-build-compatibility.test.ts
          config/scripts/mac-build-compatibility.test.mjs
          config/scripts/electron-builder-mac-channel-config.test.mjs
          config/scripts/verify-dev-channel-packaging.test.mjs
          src/shared/forge-web-app-
          src/renderer/src/forge
          src/main/source-control/forge-provider.test.ts

      - name: Record failed gate
        id: failed-gate
        if: failure() && (steps.tc.outcome == 'failure' || steps.scoped-tests.outcome == 'failure')
        run: |
          if [ "${{ steps.tc.outcome }}" = "failure" ]; then
            gate=tc
          else
            gate=scoped-tests
          fi
          echo "gate=$gate" >> "$GITHUB_OUTPUT"

      - name: Push sync branch
        if: steps.sync-check.outputs.count != '0'
        run: git push --force origin forge-sync/upstream

      - name: Open or update sync PR
        id: pr
        if: steps.sync-check.outputs.count != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          count="$(git rev-list --count forge..upstream/main)"
          title="sync: upstream $(date -u +%F) ($count commits)"
          body_file="$(mktemp)"
          {
            echo "## Upstream sync (FORGE-90)"
            echo ""
            echo "Automated daily sync of \`upstream/main\` ([stablyai/orca](https://github.com/stablyai/orca)) into \`forge\`."
            echo "Generated by [run ${GITHUB_RUN_ID}](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})."
            echo ""
            echo "**Pending upstream commits:** $count"
            echo ""
            echo "### Highlights"
            echo ""
            echo '```'
            git log --oneline forge..upstream/main | head -30
            echo '```'
            echo ""
            echo "### Review checklist"
            echo ""
            echo "- A clean merge means zero conflicts; nothing was auto-resolved."
            echo "- Spot-check the [FORGE-OVERRIDES.md](https://github.com/${GITHUB_REPOSITORY}/blob/forge/FORGE-OVERRIDES.md) files if upstream touched them — they must keep upstream structure with our whitelisted values."
            echo "- Gates ran before this PR: \`pnpm tc\` + scoped identity/forge tests. This PR does not trigger the upstream \`pull_request\` workflows (GITHUB_TOKEN PRs do not recurse)."
            echo "- Merge with a **merge commit** (no squash — it would flatten the sync structure), or close the PR and let the next run open a fresh one."
          } > "$body_file"
          existing="$(gh pr list --head forge-sync/upstream --state open --json number --jq '.[0].number')"
          if [ -n "$existing" ]; then
            gh pr edit "$existing" --title "$title" --body-file "$body_file"
            url="$(gh pr view "$existing" --json url --jq .url)"
          else
            url="$(gh pr create --base forge --head forge-sync/upstream --title "$title" --body-file "$body_file")"
          fi
          rm -f "$body_file"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Sync PR: $url" >> "$GITHUB_STEP_SUMMARY"

      - name: Record verdict
        # Always: the notify job reads the outcome even when the sync failed.
        if: always()
        env:
          COUNT: ${{ steps.sync-check.outputs.count }}
          CONFLICT_FILES: ${{ steps.conflict-report.outputs.conflict_files }}
          FAILED_GATE: ${{ steps.failed-gate.outputs.gate }}
          PR_URL: ${{ steps.pr.outputs.url }}
        run: |
          if [ "$COUNT" = "0" ]; then
            outcome=up-to-date
          elif [ -n "$CONFLICT_FILES" ]; then
            outcome=conflict
          elif [ -n "$FAILED_GATE" ]; then
            outcome=gates-failed
          elif [ -n "$PR_URL" ]; then
            outcome=pr-created
          else
            outcome=unknown
          fi
          echo "outcome=$outcome" >> "$GITHUB_OUTPUT"

  notify:
    needs: sync
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      issues: write
    steps:
      # GitHub's own scheduled-workflow failure email is unreliable for forks;
      # a recurring labeled issue is the durable, zero-secret notification.
      - name: Ensure failure label exists
        if: needs.sync.result == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh label create forge-sync-failure --color B60205 --description "Recurring forge upstream sync failures" || true

      - name: Close recovered failure issue
        if: needs.sync.result == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          issue="$(gh issue list --label forge-sync-failure --state open --json number --jq '.[0].number' || true)"
          if [ -n "$issue" ]; then
            gh issue close "$issue" --comment "Latest sync run succeeded: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          fi

      - name: Open or update failure issue
        if: needs.sync.result == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          OUTCOME: ${{ needs.sync.outputs.outcome }}
          FAILED_GATE: ${{ needs.sync.outputs.failed_gate }}
          CONFLICT_FILES: ${{ needs.sync.outputs.conflict_files }}
        run: |
          case "$OUTCOME" in
            conflict) subject="merge conflicts" ;;
            gates-failed) subject="gate failure ($FAILED_GATE)" ;;
            *) subject="failure" ;;
          esac
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          body_file="$(mktemp)"
          {
            echo "Daily upstream sync failed: **$subject**."
            echo ""
            echo "- Run: $run_url"
            echo "- Date: $(date -u +%F\ %TZ)"
            if [ -n "$CONFLICT_FILES" ]; then
              echo ""
              echo "### Conflicted files"
              echo ""
              echo '```'
              printf '%s\n' "$CONFLICT_FILES"
              echo '```'
              echo ""
              echo "Legitimate conflicts are only in files listed in FORGE-OVERRIDES.md."
              echo "Resolve manually with the forge-sync skill, then re-run the workflow (workflow_dispatch)."
            fi
            if [ -n "$FAILED_GATE" ]; then
              echo ""
              echo "Failed gate: \`$FAILED_GATE\`. Check the run log; fix forward on \`forge\` if the breakage is ours."
            fi
          } > "$body_file"
          issue="$(gh issue list --label forge-sync-failure --state open --json number --jq '.[0].number' || true)"
          if [ -n "$issue" ]; then
            gh issue comment "$issue" --body-file "$body_file"
          else
            gh issue create --title "Upstream sync failing: $subject" --label forge-sync-failure --body-file "$body_file"
          fi
          rm -f "$body_file"
